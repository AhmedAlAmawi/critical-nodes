<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="300" fill="#fafaf9"/>
  <text x="320" y="24" text-anchor="middle" font-size="9" fill="#a8a29e" letter-spacing="3" font-family="system-ui,sans-serif">ADJACENCY AS ARGUMENT</text>

  <!-- Zone bubbles -->
  <!-- Entry -->
  <circle cx="100" cy="130" r="42" fill="none" stroke="#1c1917" stroke-width="1.5"/>
  <text x="100" y="126" text-anchor="middle" font-size="9" fill="#1c1917" font-family="system-ui,sans-serif">ENTRY</text>
  <text x="100" y="140" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">public</text>

  <!-- Social -->
  <circle cx="240" cy="110" r="52" fill="none" stroke="#1c1917" stroke-width="2"/>
  <text x="240" y="106" text-anchor="middle" font-size="10" fill="#1c1917" font-family="system-ui,sans-serif">SOCIAL</text>
  <text x="240" y="120" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">primary active</text>

  <!-- Work -->
  <circle cx="400" cy="100" r="44" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">FOCUS</text>
  <text x="400" y="110" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">semi-private</text>

  <!-- Quiet -->
  <circle cx="540" cy="130" r="38" fill="#1c1917"/>
  <text x="540" y="126" text-anchor="middle" font-size="9" fill="white" font-family="system-ui,sans-serif">QUIET</text>
  <text x="540" y="140" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">private</text>

  <!-- Connection: Entry - Social (adjacent, solid) -->
  <line x1="142" y1="120" x2="188" y2="112" stroke="#1c1917" stroke-width="2"/>
  <text x="165" y="105" text-anchor="middle" font-size="7" fill="#57534e" font-family="system-ui,sans-serif">adjacent</text>

  <!-- Connection: Social - Focus (adjacent) -->
  <line x1="292" y1="106" x2="356" y2="100" stroke="#1c1917" stroke-width="2"/>
  <text x="324" y="94" text-anchor="middle" font-size="7" fill="#57534e" font-family="system-ui,sans-serif">adjacent</text>

  <!-- Connection: Focus - Quiet (buffer needed, dashed) -->
  <line x1="444" y1="110" x2="502" y2="120" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="473" y="104" text-anchor="middle" font-size="7" fill="#a8a29e" font-family="system-ui,sans-serif">buffer</text>

  <!-- Connection: Entry - Quiet (separated, bold dashed) -->
  <path d="M 100 172 Q 320 240 540 168" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="3,5" fill="none"/>
  <text x="320" y="236" text-anchor="middle" font-size="7" fill="#c8c4c0" font-family="system-ui,sans-serif">separation — these zones should not be directly connected</text>

  <!-- Legend -->
  <line x1="60" y1="264" x2="90" y2="264" stroke="#1c1917" stroke-width="2"/>
  <text x="96" y="268" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">adjacent — direct connection</text>
  <line x1="60" y1="280" x2="90" y2="280" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="96" y="284" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">buffer — transition needed</text>

  <text x="580" y="268" text-anchor="end" font-size="7" fill="#d6d3d1" font-style="italic" font-family="system-ui,sans-serif">F.D.K. Ching</text>
</svg>
