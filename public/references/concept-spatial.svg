<svg width="640" height="280" viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="280" fill="#fafaf9"/>
  <text x="320" y="24" text-anchor="middle" font-size="9" fill="#a8a29e" letter-spacing="3" font-family="system-ui,sans-serif">ONE CONCEPT — MULTIPLE SPATIAL DECISIONS</text>

  <!-- Central concept node -->
  <circle cx="320" cy="140" r="44" fill="#1c1917"/>
  <text x="320" y="135" text-anchor="middle" font-size="10" fill="white" font-family="system-ui,sans-serif">CONCEPT</text>
  <text x="320" y="150" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">your idea</text>

  <!-- Spoke 1: Material (upper left) -->
  <line x1="287" y1="109" x2="184" y2="68" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="100" y="46" width="82" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="141" y="64" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">MATERIAL</text>
  <text x="141" y="78" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">rough concrete</text>

  <!-- Spoke 2: Light (upper right) -->
  <line x1="353" y1="109" x2="452" y2="68" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="454" y="46" width="82" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="495" y="64" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">LIGHT</text>
  <text x="495" y="78" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">warm clusters</text>

  <!-- Spoke 3: Level (left) -->
  <line x1="276" y1="140" x2="172" y2="140" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="80" y="118" width="90" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="125" y="136" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">LEVELS</text>
  <text x="125" y="150" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">descent zones</text>

  <!-- Spoke 4: Zones (right) -->
  <line x1="364" y1="140" x2="468" y2="140" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="470" y="118" width="90" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="515" y="136" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">ZONES</text>
  <text x="515" y="150" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">layered areas</text>

  <!-- Spoke 5: Circulation (lower left) -->
  <line x1="289" y1="170" x2="184" y2="213" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="100" y="192" width="82" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="141" y="210" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">CIRCULATION</text>
  <text x="141" y="224" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">downward path</text>

  <!-- Spoke 6: Proportion (lower right) -->
  <line x1="351" y1="170" x2="452" y2="213" stroke="#d6d3d1" stroke-width="1.5"/>
  <rect x="454" y="192" width="82" height="42" rx="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="495" y="210" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">PROPORTION</text>
  <text x="495" y="224" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">narrowing form</text>

  <text x="320" y="264" text-anchor="middle" font-size="8" fill="#d6d3d1" font-style="italic" font-family="system-ui,sans-serif">Every decision traces back to the concept — Bryan Lawson, How Designers Think</text>
</svg>
