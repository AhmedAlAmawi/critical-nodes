<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="260" fill="#fafaf9"/>
  <text x="320" y="24" text-anchor="middle" font-size="9" fill="#a8a29e" letter-spacing="3" font-family="system-ui,sans-serif">CONCEPT AS GENERATIVE PRINCIPLE</text>

  <!-- IDEA circle -->
  <circle cx="90" cy="138" r="52" fill="none" stroke="#1c1917" stroke-width="1.5"/>
  <text x="90" y="131" text-anchor="middle" font-size="10" fill="#1c1917" font-family="system-ui,sans-serif" letter-spacing="1">IDEA</text>
  <text x="90" y="147" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">e.g. erosion</text>

  <!-- Arrow 1 -->
  <line x1="143" y1="138" x2="218" y2="138" stroke="#d6d3d1" stroke-width="1.5"/>
  <polygon points="218,132 230,138 218,144" fill="#d6d3d1"/>
  <text x="186" y="128" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">generates</text>

  <!-- PRINCIPLE box -->
  <rect x="234" y="94" width="152" height="88" rx="4" fill="none" stroke="#1c1917" stroke-width="1.5"/>
  <text x="310" y="117" text-anchor="middle" font-size="10" fill="#1c1917" font-family="system-ui,sans-serif" letter-spacing="1">PRINCIPLE</text>
  <text x="310" y="134" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">descent</text>
  <text x="310" y="147" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">compression</text>
  <text x="310" y="160" text-anchor="middle" font-size="8" fill="#78716c" font-family="system-ui,sans-serif">stratification</text>
  <text x="310" y="173" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">the logic, not the image</text>

  <!-- Arrow 2 -->
  <line x1="386" y1="138" x2="455" y2="138" stroke="#d6d3d1" stroke-width="1.5"/>
  <polygon points="455,132 467,138 455,144" fill="#d6d3d1"/>
  <text x="421" y="128" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">becomes</text>

  <!-- FORM box (3 stacked zones) -->
  <rect x="468" y="86" width="136" height="26" rx="2" fill="none" stroke="#1c1917" stroke-width="1.5"/>
  <text x="536" y="104" text-anchor="middle" font-size="9" fill="#1c1917" font-family="system-ui,sans-serif">wide zone</text>
  <rect x="480" y="120" width="112" height="24" rx="2" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="536" y="137" text-anchor="middle" font-size="9" fill="#44403c" font-family="system-ui,sans-serif">mid zone</text>
  <rect x="500" y="152" width="72" height="22" rx="2" fill="#1c1917"/>
  <text x="536" y="167" text-anchor="middle" font-size="9" fill="white" font-family="system-ui,sans-serif">core</text>
  <text x="536" y="194" text-anchor="middle" font-size="8" fill="#a8a29e" font-family="system-ui,sans-serif">spatial form</text>

  <!-- Note -->
  <text x="320" y="230" text-anchor="middle" font-size="8" fill="#c8c4c0" font-style="italic" font-family="system-ui,sans-serif">The concept is the rule that generates the form — not a picture of it.</text>
  <text x="320" y="246" text-anchor="middle" font-size="8" fill="#d6d3d1" font-family="system-ui,sans-serif">Peter Zumthor — Thinking Architecture</text>
</svg>
